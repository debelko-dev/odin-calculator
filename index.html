<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Odin Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>The Odin Calculator</h1>
    <div class="container">
        <div class="input"></div>
        <div class="calculator-buttons">
            <div>C</div>
            <div>CE</div>
            <div>%</div>
            <div>/</div>
        </div>
        <div class="calculator-buttons">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>*</div>
        </div>
        <div class="calculator-buttons">
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>-</div>
        </div>
        <div class="calculator-buttons">
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div>+</div>
        </div>
        <div class="calculator-buttons">
            <div>.</div>
            <div>0</div>
            <div>#</div>
            <div>=</div>
        </div>
    </div>
</body>
</html>
